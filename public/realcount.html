<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realcount - Pemilihan Ketua OSIS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white p-6 md:p-10">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-8 flex-wrap gap-3">
      <div>
        <p id="namaSekolah" class="text-blue-300 uppercase tracking-wide text-sm">Memuat...</p>
        <h1 class="text-3xl md:text-4xl font-extrabold">REALCOUNT PEMILIHAN KETUA OSIS</h1>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-500">Pembaruan terakhir</p>
        <p id="lastUpdated" class="font-mono text-sm">-</p>
      </div>
    </div>

    <div class="grid sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white/5 border border-white/10 rounded-2xl p-5 text-center">
        <p class="text-xs text-slate-400 mb-1">TOTAL PEMILIH</p>
        <p id="totalPemilih" class="text-3xl font-extrabold">-</p>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl p-5 text-center">
        <p class="text-xs text-slate-400 mb-1">SUDAH MEMILIH</p>
        <p id="sudahMemilih" class="text-3xl font-extrabold text-green-400">-</p>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl p-5 text-center">
        <p class="text-xs text-slate-400 mb-1">PARTISIPASI</p>
        <p id="persentase" class="text-3xl font-extrabold text-blue-400">-</p>
      </div>
    </div>

    <div id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function fmtNum(n){ return new Intl.NumberFormat('id-ID').format(n||0); }

async function refresh() {
  try {
    const [settingsRes, dataRes] = await Promise.all([
      fetch('/api/public/settings').then(r => r.json()),
      fetch('/api/public/realcount').then(r => r.json()),
    ]);

    if (settingsRes.ok) document.getElementById('namaSekolah').textContent = settingsRes.data.nama_sekolah + ' — ' + settingsRes.data.tahun_pelajaran;

    if (!dataRes.ok) return;
    const d = dataRes.data;
    document.getElementById('totalPemilih').textContent = fmtNum(d.total_pemilih);
    document.getElementById('sudahMemilih').textContent = fmtNum(d.sudah_memilih);
    const pct = d.total_pemilih > 0 ? ((d.sudah_memilih / d.total_pemilih) * 100).toFixed(2) : '0.00';
    document.getElementById('persentase').textContent = pct + '%';
    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString('id-ID');

    const grid = document.getElementById('grid');
    const maxVotes = Math.max(1, ...d.candidates.map(c => c.total_suara));
    grid.innerHTML = d.candidates.map(c => `
      <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
        <div class="aspect-video bg-slate-800 flex items-center justify-center">
          ${c.foto ? `<img src="${c.foto}" class="w-full h-full object-cover" alt="Foto Paslon ${c.nomor_urut}">` : `<span class="text-slate-500 text-sm">Foto Paslon ${c.nomor_urut}</span>`}
        </div>
        <div class="p-5">
          <p class="text-blue-300 font-bold text-sm mb-1">PASLON ${c.nomor_urut}</p>
          <p class="font-semibold text-lg mb-3">${escapeHtml(c.nama_ketua)} &amp; ${escapeHtml(c.nama_wakil || '-')}</p>
          <div class="w-full bg-slate-800 rounded-full h-3 mb-2 overflow-hidden">
            <div class="bg-blue-500 h-3 rounded-full transition-all duration-700" style="width:${(c.total_suara/maxVotes*100)}%"></div>
          </div>
          <div class="flex justify-between items-baseline">
            <span class="text-2xl font-extrabold">${fmtNum(c.total_suara)}</span>
            <span class="text-slate-400 text-sm">${c.persentase}%</span>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error('Gagal memuat realcount', e);
  }
}
refresh();
setInterval(refresh, 10000); // auto-refresh setiap 10 detik tanpa reload halaman
</script>
</body>
</html>
