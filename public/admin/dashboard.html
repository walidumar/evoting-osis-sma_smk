<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - E-Voting OSIS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <div id="adminNav"></div>
  <div class="max-w-6xl mx-auto p-4 md:p-8">
    <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

    <div class="grid sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">TOTAL SISWA</p><p id="totalSiswa" class="text-2xl font-bold">-</p></div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">TOTAL GURU</p><p id="totalGuru" class="text-2xl font-bold">-</p></div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">TOTAL PEMILIH</p><p id="totalPemilih" class="text-2xl font-bold">-</p></div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">SUDAH MEMILIH</p><p id="sudahMemilih" class="text-2xl font-bold text-green-400">-</p></div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">BELUM MEMILIH</p><p id="belumMemilih" class="text-2xl font-bold text-yellow-400">-</p></div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-4"><p class="text-xs text-slate-400">PARTISIPASI</p><p id="persentase" class="text-2xl font-bold text-blue-400">-</p></div>
    </div>

    <div class="grid lg:grid-cols-2 gap-6 mb-8">
      <div class="bg-white/5 border border-white/10 rounded-xl p-5">
        <h2 class="font-semibold mb-3">Suara per Paslon</h2>
        <canvas id="chartCandidates" height="220"></canvas>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-xl p-5">
        <h2 class="font-semibold mb-3">Partisipasi Siswa vs Guru</h2>
        <canvas id="chartPartisipasi" height="220"></canvas>
      </div>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-xl p-5 mb-8">
      <h2 class="font-semibold mb-3">Voting Berdasarkan Waktu (per jam)</h2>
      <canvas id="chartTime" height="120"></canvas>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <h2 class="font-semibold mb-3">Aktivitas Terbaru (tanpa data pilihan - privasi terjaga)</h2>
      <div id="recentVoters" class="text-sm divide-y divide-white/5"></div>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/admin-nav.js"></script>
<script>
async function load() {
  const me = await guardAdmin();
  if (!me) return;

  const r = await apiGet('/api/admin/dashboard/stats');
  if (!r.ok) return;
  const d = r.data;
  document.getElementById('totalSiswa').textContent = fmtNum(d.total_siswa);
  document.getElementById('totalGuru').textContent = fmtNum(d.total_guru);
  document.getElementById('totalPemilih').textContent = fmtNum(d.total_pemilih);
  document.getElementById('sudahMemilih').textContent = fmtNum(d.sudah_memilih);
  document.getElementById('belumMemilih').textContent = fmtNum(d.belum_memilih);
  document.getElementById('persentase').textContent = fmtPercent(d.persentase_partisipasi);

  new Chart(document.getElementById('chartCandidates'), {
    type: 'bar',
    data: {
      labels: d.suara_per_paslon.map(c => 'Paslon ' + c.nomor_urut + ' - ' + c.nama_ketua),
      datasets: [{ label: 'Total Suara', data: d.suara_per_paslon.map(c => c.total_suara), backgroundColor: '#3b82f6' }],
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#cbd5e1' } }, y: { ticks: { color: '#cbd5e1' } } } },
  });

  new Chart(document.getElementById('chartPartisipasi'), {
    type: 'doughnut',
    data: {
      labels: ['Partisipasi Siswa (%)', 'Partisipasi Guru (%)'],
      datasets: [{ data: [d.partisipasi_siswa, d.partisipasi_guru], backgroundColor: ['#3b82f6', '#10b981'] }],
    },
    options: { plugins: { legend: { labels: { color: '#cbd5e1' } } } },
  });

  new Chart(document.getElementById('chartTime'), {
    type: 'line',
    data: {
      labels: d.voting_by_hour.map(v => v.jam),
      datasets: [{ label: 'Jumlah Suara Masuk', data: d.voting_by_hour.map(v => v.jumlah), borderColor: '#f59e0b', tension: 0.3 }],
    },
    options: { plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#cbd5e1' } }, y: { ticks: { color: '#cbd5e1' } } } },
  });

  const rv = await apiGet('/api/admin/monitoring/recent-voters');
  if (rv.ok) {
    document.getElementById('recentVoters').innerHTML = rv.data.map(v => `
      <div class="py-2 flex justify-between">
        <span>${v.tipe === 'siswa' ? '🎓' : '🧑‍🏫'} ${v.nama} <span class="text-slate-500">(${v.ket || '-'})</span></span>
        <span class="text-slate-500">${v.voted_at || '-'}</span>
      </div>
    `).join('') || '<p class="text-slate-500 py-2">Belum ada aktivitas.</p>';
  }
}
load();
</script>
</body>
</html>
